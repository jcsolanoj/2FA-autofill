<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none';">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>2FA Autofill Mobile</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon.png">
  <link rel="stylesheet" href="./app.css">
</head>
<body>

  <header class="app-header">
    <div class="logo-area">
      <svg class="logo-svg" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm-1 14l-3.5-3.5 1.41-1.41L11 13.17l4.59-4.59L17 10l-6 6z" fill="url(#lg)"/>
        <defs>
          <linearGradient id="lg" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
            <stop stop-color="#0052D4"/><stop offset="0.5" stop-color="#4364F7"/><stop offset="1" stop-color="#6FB1FC"/>
          </linearGradient>
        </defs>
      </svg>
      <h1>2FA Autofill <span class="badge">Mobile</span></h1>
    </div>
  </header>

  <main class="main-content">
    <div id="empty-state" class="empty-state">
      <div class="empty-icon">🛡️</div>
      <h2>Sin cuentas todavía</h2>
      <p>Toca el botón <strong>+</strong> abajo para agregar tu primera clave secreta 2FA.</p>
    </div>

    <div id="accounts-list" class="accounts-list"></div>
  </main>

  <button class="fab-add" id="btn-open-modal" type="button" title="Agregar cuenta" aria-label="Agregar cuenta">+</button>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2>Agregar Cuenta 2FA</h2>
        <button class="btn-close" id="btn-close-modal" type="button" aria-label="Cerrar">&times;</button>
      </div>
      <form id="add-form">
        <div class="form-group">
          <label for="input-email">Usuario o Alias</label>
          <input type="text" id="input-email" placeholder="ej. Trabajo - usuario@empresa.com" required autocomplete="off">
        </div>
        <div class="form-group">
          <label for="input-secret">Clave Secreta 2FA (Base32 o URI otpauth://)</label>
          <input type="text" id="input-secret" placeholder="JBSWY3DPEHPK3PXP" required autocomplete="off" autocapitalize="characters">
        </div>
        <button type="submit" class="btn-submit">Guardar en mi Dispositivo</button>
      </form>
    </div>
  </div>

  <div class="toast" id="toast">Código copiado</div>

  <script src="./totp.js"></script>
  <script src="./app.js"></script>
</body>
</html>
